{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}{{ titulo }}{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">

    <nav class="navbar navbar-expand-lg navbar-light bg-light mb-4 px-3 rounded shadow-sm">
        <a class="navbar-brand" href="{% url 'index' %}">🛠️ Gestão de Reparos</a>
        <div class="navbar-nav">
            <a class="nav-link" href="{% url 'index' %}">Sobre</a>
            <a class="nav-link" href="{% url 'listar-clientes' %}">Clientes</a>
            <a class="nav-link" href="{% url 'listar-equipamentos' %}">Equipamentos</a>
            <a class="nav-link" href="{% url 'listar-pecas' %}">Peças</a>
        </div>
    </nav>
    <h2 class="mb-4">{{ titulo }}</h2>

    <main>
        {% block conteudo %}
        {% endblock %}
    </main>

    <footer class="mt-5 py-3 text-center text-muted border-top">
        <p>&copy; 2026 - Sistema de Gestão de Reparos</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
