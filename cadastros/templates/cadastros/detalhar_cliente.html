{% extends 'base.html' %}

{% block conteudo %}
    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <h5 class="card-title text-primary">Ficha: {{ object.nome }}</h5>
            <ul class="list-group list-group-flush mt-3">
                <li class="list-group-item"><strong>Documento:</strong> {{ object.cpf_cnpj }}</li>
                <li class="list-group-item"><strong>Telefone:</strong> {{ object.telefone }}</li>
                <li class="list-group-item"><strong>Endereço:</strong> {{ object.endereco }}</li>
            </ul>
        </div>
    </div>

    <div>
        <a href="{% url 'atualizar-cliente' object.pk %}" class="btn btn-warning">Editar Dados</a>
        <a href="{% url 'listar-clientes' %}" class="btn btn-secondary">Voltar para a Lista</a>
    </div>
{% endblock %}
