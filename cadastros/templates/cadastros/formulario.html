{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block titulo %}Formulário - {{ titulo }}{% endblock %}

{% block conteudo %}
    <form method="POST">
        {% csrf_token %}
        
        {{ form|crispy }}
        
        <div class="mt-3">
            <button type="submit" class="btn btn-success">Salvar Registro</button>
            <a href="{% url 'index' %}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
    </form>
{% endblock %}
